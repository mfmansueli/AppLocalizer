		000000000000000150000000 /* Lint */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = Lint;
			shellPath = /bin/sh;
			shellScript = (
				"# SwiftFormat + SwiftLint findings show up as warnings in Xcode on local",
				"# builds (configs: .swiftformat, .swiftlint.yml). Neither tool is installed",
				"# on Xcode Cloud, so skip there.",
				"if [ \"$CI_XCODE_CLOUD\" = \"TRUE\" ]; then",
				"    exit 0",
				"fi",
				"",
				"export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"",
				"cd \"$SRCROOT\" || exit 0",
				"",
				"# --lenient keeps every finding a warning (never an error), so lint can't",
				"# fail the build. --config pins the repo's own .swiftformat, so a checkout",
				"# nested under another folder with one (e.g. a git worktree) isn't affected.",
				"if command -v swiftformat >/dev/null 2>&1; then",
				"    swiftformat --lint --lenient --config .swiftformat .",
				"else",
				"    echo \"warning: SwiftFormat not installed (brew install swiftformat)\"",
				"fi",
				"",
				"if command -v swiftlint >/dev/null 2>&1; then",
				"    swiftlint lint --quiet --lenient",
				"else",
				"    echo \"warning: SwiftLint not installed (brew install swiftlint)\"",
				"fi",
				"",
			);
			showEnvVarsInLog = 0;
		};
/* End PBXShellScriptBuildPhase section */

